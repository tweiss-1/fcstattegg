<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Stattegg - Fanartikel-Bestellung</title>
    <link rel="icon" type="image/png" href="images/Logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/shop.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <div class="page-header">
        <h2>Fanartikel-Bestellung</h2>
        <p>Trikots, Hoodies und mehr aus der Vereinskollektion</p>
    </div>

    <div class="container container--narrow">
        <div class="card card--form">
            <p class="subtitle">Wähle deine gewünschten Artikel aus. Du kannst mehrere Artikel gleichzeitig in den Mengen eintragen.</p>

            <!-- Formular sendet die Daten an das PHP-Backend -->
            <form action="sendmail.php" method="POST" id="orderForm">
                
                <h2 class="section-title section-title--sm">1. Deine Daten</h2>

                <input type="hidden" name="_subject" value="Neue Fanartikel-Bestellung">

                <div class="row">
                    <div class="col form-group">
                        <label for="vorname">Vorname *</label>
                        <input type="text" id="vorname" name="vorname" required autocomplete="given-name">
                    </div>
                    <div class="col form-group">
                        <label for="nachname">Nachname *</label>
                        <input type="text" id="nachname" name="nachname" required autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="anschrift">Anschrift (Straße und Hausnummer) *</label>
                    <input type="text" id="anschrift" name="anschrift" required autocomplete="street-address">
                </div>

                <div class="row">
                    <div class="col col--narrow form-group">
                        <label for="plz">PLZ *</label>
                        <input type="text" id="plz" name="plz" required inputmode="numeric" pattern="[0-9]{4,5}"
                               title="Bitte eine 4- oder 5-stellige Postleitzahl eingeben" autocomplete="postal-code">
                    </div>
                    <div class="col form-group">
                        <label for="ort">Ort *</label>
                        <input type="text" id="ort" name="ort" required autocomplete="address-level2">
                    </div>
                </div>

                <div class="row">
                    <div class="col form-group">
                        <label for="email">E-Mail-Adresse (für die Bestellbestätigung) *</label>
                        <input type="email" id="email" name="email" required placeholder="deine.email@example.com" autocomplete="email">
                    </div>
                    <div class="col form-group">
                        <label for="telefon">Telefonnummer (optional)</label>
                        <input type="tel" id="telefon" name="telefon" placeholder="+43 660 ..." autocomplete="tel">
                    </div>
                </div>

                <h2 class="section-title section-title--sm">2. Artikel auswählen</h2>

                <table class="article-table">
                    <thead>
                        <tr><th>Artikel</th><th>Preis</th><th>Größe</th><th>Anzahl</th></tr>
                    </thead>
                    <tbody id="article-rows">
                        <tr><td colspan="4" class="text-center text-muted">Lade Artikel...</td></tr>
                    </tbody>
                </table>

                <div class="total-box">
                    <span>Gesamtsumme:</span>
                    <span id="totalPrice">€ 0,00</span>
                </div>

                <!-- Versteckte Felder für die Zusammenfassung durch shop.js -->
                <input type="hidden" name="Bestellung" id="orderSummary">
                <input type="hidden" name="Gesamtsumme" id="orderTotal">

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="datenschutz" name="datenschutz" required>
                    <label for="datenschutz">Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen und stimme zu, dass meine Daten zur Abwicklung der Bestellung verarbeitet werden. *</label>
                </div>

                <button type="submit" class="btn">Verbindlich bestellen</button>
            </form>
        </div>
    </div>

    <div id="site-footer"></div>
</body>
</html>
