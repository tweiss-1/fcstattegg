<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Stattegg - Fanartikel-Bestellung</title>
    <link rel="icon" type="image/png" href="images/Logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/shop.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <div class="page-header">
        <h2>Fanartikel-Bestellung</h2>
        <p>Trikots, Hoodies und mehr aus der Vereinskollektion</p>
    </div>

    <div class="container container--narrow">
        <div class="card card--form">
            <p class="subtitle">Wähle deine gewünschten Artikel aus. Du kannst mehrere Artikel gleichzeitig in den Mengen eintragen.</p>

            <!--
                BESTELLUNG PER E-MAIL (Formspree, formspree.io):
                1. Dort ein Formular anlegen und die Form-ID kopieren.
                2. DEINE-FORM-ID unten durch die echte ID ersetzen.
                   Solange der Platzhalter drinsteht, blockiert shop.js das Absenden.
                3. Die Bestätigung an den Besteller läuft über die Auto-Responder-Funktion
                   von Formspree (nutzt das Feld "email").
                Die Bestellung kommt als Zusammenfassung ("Bestellung") und Gesamtsumme an.
                Artikel und Preise stehen in data/artikel.csv.
            -->
            <form action="https://formspree.io/f/DEINE-FORM-ID" method="POST" id="orderForm">

                <h2 class="section-title section-title--sm">1. Angaben zur Person</h2>

                <div class="row">
                    <div class="col form-group">
                        <label for="spieler">Name Spieler/in *</label>
                        <input type="text" id="spieler" name="spieler" required placeholder="Vor- und Nachname">
                    </div>
                    <div class="col form-group">
                        <label for="elternteil">Name Elternteil (bei Jugend)</label>
                        <input type="text" id="elternteil" name="elternteil" placeholder="Optional">
                    </div>
                </div>

                <div class="row">
                    <div class="col form-group">
                        <label for="mannschaft">Mannschaft *</label>
                        <select id="mannschaft" name="mannschaft" required>
                            <option value="" disabled selected>Lade Mannschaften...</option>
                        </select>
                    </div>
                    <div class="col form-group">
                        <label for="email">E-Mail-Adresse (für Bestellbestätigung) *</label>
                        <input type="email" id="email" name="email" required placeholder="deine.email@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="telefon">Telefonnummer *</label>
                    <input type="tel" id="telefon" name="telefon" required placeholder="+43 660 ...">
                </div>

                <h2 class="section-title section-title--sm">2. Artikel auswählen</h2>

                <table class="article-table">
                    <thead>
                        <tr><th>Artikel</th><th>Preis</th><th>Größe</th><th>Anzahl</th></tr>
                    </thead>
                    <tbody id="article-rows">
                        <tr><td colspan="4" class="text-center text-muted">Lade Artikel...</td></tr>
                    </tbody>
                </table>

                <div class="total-box">
                    <span>Gesamtsumme:</span>
                    <span id="totalPrice">€ 0,00</span>
                </div>

                <input type="hidden" name="Bestellung" id="orderSummary">
                <input type="hidden" name="Gesamtsumme" id="orderTotal">

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="datenschutz" name="datenschutz" required>
                    <label for="datenschutz">Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen und stimme zu, dass meine Daten zur Abwicklung der Bestellung verarbeitet werden. *</label>
                </div>

                <button type="submit" class="btn">Verbindlich bestellen</button>
            </form>
        </div>
    </div>

    <div id="site-footer"></div>
</body>
</html>
