<h3 class="section-title">Funktionäre & Betreuer</h3>
        <!-- Das Grid ist hier leer und wird per JavaScript befüllt -->
        <div class="team-grid" id="team-grid">
            <p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Lade Team-Daten...</p>
        </div>
    </div>

    <!-- JavaScript zum Laden der CSV und Generieren der Karten -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Pfad zu deiner CSV-Datei
            fetch('team.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Netzwerkfehler beim Laden der CSV-Datei');
                    }
                    return response.text();
                })
                .then(data => {
                    parseAndDisplayTeam(data);
                })
                .catch(error => {
                    console.error('Fehler:', error);
                    document.getElementById('team-grid').innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: red;">Fehler beim Laden der Kontaktdaten.</p>';
                });
        });

        function parseAndDisplayTeam(csvText) {
            const lines = csvText.trim().split('\n');
            const grid = document.getElementById('team-grid');
            grid.innerHTML = ''; // Vorherigen Inhalt (Ladeanzeige) leeren

            // Wir starten bei i = 1, um die Kopfzeile (Header) zu überspringen
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // Zeile anhand des Strichpunkts aufteilen
                const cols = line.split(';');
                if (cols.length < 5) continue;

                const name = cols[0].trim();
                const rolle = cols[1].trim();
                const telefon = cols[2].trim();
                const email = cols[3].trim();
                const bild = cols[4].trim();

                // HTML-Karte für jedes Teammitglied zusammenbauen
                const cardHTML = `
                    <div class="team-card">
                        <div class="team-avatar">
                            <img src="${bild}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="width: 100%; height: 100%; object-fit: cover;">
                            <div class="team-avatar-fallback" style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center; background: var(--bg-light); color: var(--text-muted);">
                                <svg fill="currentColor" viewBox="0 0 24 24" width="80" height="80" style="opacity: 0.5;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            </div>
                            <div class="team-overlay">
                                <div class="contact-info">
                                    <p><strong>📞 Tel:</strong> <a href="tel:${telefon}">${telefon}</a></p>
                                    <p><strong>✉️ E-Mail:</strong> <a href="mailto:${email}">${email}</a></p>
                                </div>
                            </div>
                        </div>
                        <h4>${name}</h4>
                        <p>${rolle}</p>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            }
        }
    </script>
    <footer>
        <p>&copy; FC Stattegg - am Wiesengrund 6 - 8046 Graz Stattegg</p>
        <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 5px;">Offizielle Vereinshomepage</p>
    </footer>
</body>
</html>
